# Build + push the prod->qa reference-sync Cloud Run Job image (MONEY-855).
# Build context = repo ROOT (the Dockerfile COPYs scripts/ops/sync-prod-to-qa.sh).
#   gcloud builds submit --config=scripts/ops/sync-job/cloudbuild.yaml .
# (invoked by scripts/ops/setup-sync-job.sh)
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - scripts/ops/sync-job/Dockerfile
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: gcr.io/stock-book-483718/sync-prod-to-qa:latest
options:
  logging: CLOUD_LOGGING_ONLY
