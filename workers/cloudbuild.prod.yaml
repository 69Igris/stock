# GCP Cloud Build - Workers Production Environment
# Trigger: Push to 'main' branch or tag 'v*'

substitutions:
  _REGION: "asia-south1"
  _SERVICE_NAME: "stockbook-workers-prod"
  # MONEY-1235 — the suffix every per-environment Cloud Run JOB carries
  # (feed-parse-prod, xbrl-backfill-prod, ...). Used ONLY to name jobs in the
  # re-pin step at the bottom; the image tag itself is written out literally so
  # it stays character-identical to the tag the build step pushes.
  _ENV: "prod"

steps:
  # Build Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/stockbook-workers:prod-$COMMIT_SHA"
      - "-t"
      - "gcr.io/$PROJECT_ID/stockbook-workers:prod-latest"
      - "-t"
      - "gcr.io/$PROJECT_ID/stockbook-workers:latest"
      - "--build-arg"
      - "DD_VERSION=$COMMIT_SHA"
      - "-f"
      - "workers/Dockerfile"
      - "."

  # Push images
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "--all-tags", "gcr.io/$PROJECT_ID/stockbook-workers"]

  # Deploy to Cloud Run with Datadog sidecar
  # Uses gcloud run services replace with a YAML service definition
  # for multi-container (sidecar) support. The Datadog serverless-init
  # container runs the local agent that dd-trace needs (localhost:8126).
  # ─────────────────────────────────────────────────────────────────
  # NOTE: the service.yaml heredoc below is ONE Cloud Build arg, and
  # Cloud Build caps a single arg at 10,000 characters. It was already
  # at 11,600 and failing with:
  #   invalid build: invalid .steps field: build step 2 arg 1 too long
  # The commentary that used to live INSIDE the heredoc is reproduced
  # here instead — comments out here cost nothing, comments in there
  # count toward the cap. Keep it that way, and re-check with:
  #   python3 -c "…" (see scripts/README.md) after adding env vars.
  #
  # Relocated commentary:
  # Studio render (/jobs/studio-render): Veo + Google TTS via the
  # Cloud Run service SA (already has aiplatform.user). Output/fonts/
  # chromium paths are baked into the Dockerfile ENV.
  # Dodo Payments (MONEY-764): account-deletion runs on the
  # worker and does a best-effort Dodo subscription cancel —
  # without these, isDodoConfigured() was false and every
  # deletion silently skipped the cancel (deleted users kept
  # getting billed). Live-mode key for prod.
  # MONEY-626: research synthesis runs in this worker and
  # routes founder-gated Claude models. ANTHROPIC_API_KEY_PROD
  # currently holds the SAME dev key as QA (interim) — rotate
  # to a prod-scoped key before opening Claude beyond the
  # founder. Absent → the router falls back to Gemini.
  # MONEY-650 - Gemini Developer API key. When set,
  # @usemoney/core/gemini calls the Developer API; absent,
  # it falls back to Vertex. NOTE: GOOGLE_GENAI_API_KEY_PROD
  # currently holds the QA-SA key — rotate to a prod-SA-bound
  # key before prod launch.
  # MONEY-1085 / MONEY-1097 - arm the raw exchange-feed archive.
  #
  # PROD is the ARCHIVE side: it fetches each NSE/BSE file once
  # and writes the bytes to gs://stockbook-content-prod/feeds/
  # so they can be parsed later (P4) and replayed by QA. Until
  # this was set the whole archive was inert - bhavcopy-sync and
  # report-archive-sync fetched normally and stored NOTHING,
  # which is why report-archive-sync reports `fetched` rather
  # than `archived` for those runs.
  #
  # MUST sit beside GCP_STORAGE_BUCKET: initFeedArchive()
  # (workers/src/lib/feed-archive-store.ts) requires BOTH and
  # logs "feed archive stays OFF" if either is missing.
  #
  # It belongs HERE rather than in a `gcloud run services
  # update`: line ~293 deploys with `gcloud run services
  # replace`, which is declarative and replaces the entire
  # container spec - so any env var set out-of-band is silently
  # erased by the next build, and the only symptom would be
  # archived counts quietly going to zero.
  # MONEY-783 - Document AI PDF text extraction (stock-document-extract).
  # PROCESSOR_ID is the Document OCR processor id; when unset the
  # worker falls back to pdf-parse so it works pre-provisioning.
  # MONEY-864: unsubscribe-link signing for individual newsletter sends.
  # MONEY-144 - account-deletion worker calls
  # Clerk.users.lockUser; clerk-delete-sweep worker
  # calls Clerk.users.deleteUser. Both need the Clerk
  # secret key.
  # ─────────────────────────────────────────────────────────────────
  # MONEY-1255 - DOC_FINANCIALS_APPLY arms the document-financials projection
  # to WRITE into stock_financials. It ships PRESENT and "false": absent and
  # "false" must NOT be the same state, because absent is exactly how
  # MF_METADATA_PROVIDER disabled its job silently for months (MONEY-1214).
  # Compared against the LITERAL string, never Boolean() - Boolean("false") is
  # true, which would arm the one configuration meant to keep it off.
  #
  # MONEY-1314 - DOC_PARSE_MODEL names the model the document lane runs on, and
  # DOC_PARSE_BUDGET_MS its per-document wall clock. Both were in NEITHER spec,
  # so the lane was un-overridable in prod and QA except by code change and
  # silently pinned to gemini-3.5-flash — four times gemini-3.7-flash's batch
  # rate across ~48,000 documents. `resolveDocParseModel` also IGNORES an id
  # that is not in the model registry, warning and falling back, so a typo here
  # costs 4x with a log line as the only symptom.
  #
  # NOTE these two carry NO comment inside the container spec below, and that is
  # not an oversight: the spec is heredoc'd into a `gcloud run services replace`
  # ARGUMENT, whose length the OS caps. Prose inside it is charged against the
  # deploy — `cloudbuild-arg-limit.test.ts` failed at 30 chars of headroom when
  # this explanation was written there instead of here.
  #
  # MONEY-1314 - DOC_CONVERT_CONTAINER_MI must EQUAL this service's `memory:`
  # limit below. The PDF converter refuses a document whose estimated peak RSS
  # (2.3-4.8x file size) would not fit, and it sizes that ceiling from THIS
  # value. It was derived against 2048 MiB - what the backfill JOB gets - while
  # this service ran 1Gi, so the ceiling sat ABOVE the container limit and a
  # ~200 MB annual report passed the guard and OOM-killed the container, taking
  # every other in-flight message with it. `doc-convert-memory.test.ts` keeps
  # the two in agreement.
  #
  # MONEY-1373 - THE `memory:` LIMIT IS 4Gi BECAUSE OF THE CANDLE EVICTION
  # LEAVES, not because of the converter. `candle-evict` fans out one message
  # per (symbol, timeframe) intraday unit; a leaf holds ONE DECODED cold shard
  # while it rewrites it, and a 242,000-bar M1 year-shard measured 160-250 MB of
  # resident heap on node 22 (2026-09-07, real encode/decode). Cloud Run admits
  # `containerConcurrency: 10` messages per container, and the 507 M1 leaves are
  # published last as one burst, so ten of them on one instance is the expected
  # steady state of that phase rather than a tail: 250 MB x 10 = 2500 MiB.
  # 1Gi could not hold two, and an OOM kill takes every other in-flight message
  # with it. `candle-evict-logic.test.ts` asserts the inequality against BOTH
  # numbers read out of this file, so lowering either one fails the suite.
  #
  # DOC_INGEST_REALTIME arms the store-time announce for the ingest lane. It
  # ships PRESENT and "false" - four artifacts in this branch assert it "ships
  # false" and it was in NEITHER spec, which is exactly how MF_METADATA_PROVIDER
  # disabled its job silently for months. Compared to the LITERAL string, never
  # Boolean(): Boolean("false") is true.
  #
  # MONEY-1324 (P17) - US_FILING_INSIGHT_APPLY arms the 8-K/6-K exhibit insight
  # fan-out. Same discipline as the line above and the two XBRL arms: PRESENT
  # and "false" in BOTH specs (absent and explicitly-false must not be one
  # state), compared to the LITERAL string, and read PER CALL rather than into a
  # module const - a module-level read freezes at import and a warm Cloud Run
  # container then treats a redeployed switch as no switch at all.
  #
  # DISARMED IS NOT INERT HERE. The `us-filing-insight-sweep` cron still runs
  # every 10 minutes, still diffs the cohort and still reports its queue depth
  # through job-outcome; it only stops short of publishing, so no leaf runs and
  # no PAID model call is spent. That is deliberate: the number the arming
  # decision will be made on is the queue depth, and a lane whose off state
  # emits no series at all is a lane nobody can watch fill up.
  #
  # IT SHIPS FALSE AS A DEPLOY DECISION, not as an unfinished wire. The lane is
  # complete: routes/us-filing-insight.ts injects the real analyser, and the
  # per-document processor would default to a stub that THROWS if it did not.
  # What arming buys is SPEND - one paid Gemini call per document - so the
  # founder flips it against a measured queue depth rather than discovering the
  # bill. It is one deploy, in one env at a time, and nothing about it is
  # one-way except the money: a READY row stamps `sourceTextHash`, so a document
  # already read is never re-read and re-charged.
  #
  # MONEY-1214 - MF_METADATA_PROVIDER turns the AMFI metadata provider ON.
  # `mf-metadata-weekly` had been ENABLED and firing every Sunday 21:00 IST
  # while this var was unset ANYWHERE, so `isAmfiFundMetadataEnabled()`
  # returned false, no provider registered, and the run logged "No MF metadata
  # provider is configured" and exited. All 14,225 funds carry 0 expenseRatio /
  # 0 aum / 0 launchDate as a result - a job reporting success while writing
  # nothing, the same shape as MONEY-1211's tier selector.
  #
  # MONEY-1220 - XBRL_PROJECTION_APPLY is the XBRL write arm. It ships
  # PRESENT-BUT-OFF on purpose: an absent var and a "false" var must not be the
  # same thing. "Absent" is exactly how MF_METADATA_PROVIDER above disabled its
  # job silently for months. Flipping it to "true" is a deliberate deploy whose
  # precondition is an F3 reconcile reading READY for every field -
  # StockFinancials has no `source` in its unique key, so the first XBRL write
  # for a period destroys the value it replaced.
  #
  # MONEY-1286 - XBRL_RATIOS_APPLY is the RATIOS write arm, and it is now a
  # SEPARATE switch from XBRL_PROJECTION_APPLY above. Both jobs used to read the
  # projection flag, so one variable decided two irreversible writes into two
  # different tables. Both gates were then run against prod on 2026-08-30 and
  # DISAGREED:
  #
  #   `xbrlratios prod`  PASS      - roe READY at 666/697 (95.6%), none BLOCKED
  #   `xbrlrecon prod`   NOT READY - totalLiabilities disagrees on 17.2% of
  #                                  pairs, totalAssets/totalEquity 6.9%,
  #                                  netIncome 5.9%, against a 5.0% floor
  #
  # The evidence supports arming the ratios half and NOT the financials half,
  # and with one flag that state could not be expressed at all: arming what
  # passed would have armed what failed, into a table whose unique key carries
  # no `source`, so the first write destroys the value the reconcile still needs
  # to compare against.
  #
  # It ships PRESENT-BUT-OFF in BOTH specs for now, the same discipline as
  # XBRL_PROJECTION_APPLY: an absent var and a "false" var must not be the same
  # thing ("absent" is how MF_METADATA_PROVIDER disabled its job silently for
  # months, MONEY-1214). Prod flips to "true" as a deliberate deploy once
  # MONEY-1288 widens the gate; QA stays "false" because a QA write would be
  # dropped by the next sync-prod-to-qa restore anyway. Compared against the
  # LITERAL string, never Boolean() - Boolean("false") is true.
  #
  # MONEY-1346 - DOC_RATIOS_APPLY is a THIRD arm, and it is separate from
  # XBRL_RATIOS_APPLY for a reason that is the opposite of the one above.
  #
  # The `xbrl-ratios` job now also derives ratios for companies that have NO
  # XBRL FILING AT ALL, from `document_financial_extracts` - a model's reading
  # of the company's own annual report. Measured on prod 2026-09-05: 1,248
  # Indian symbols hold EXTRACTED ANNUAL extract rows, hold no filing, and hold
  # ZERO `stock_ratios` rows. Not written badly - never CONSIDERED, because the
  # candidate query selected `xbrlFilings: { some: {} }`.
  #
  # That cohort has NO INCUMBENT ROW TODAY, so every write it makes is a pure
  # CREATE. Nothing is displaced and nothing is destroyed, so the one-way-door
  # argument that gates XBRL_RATIOS_APPLY - the first XBRL write replaces the
  # vendor row, after which the gate can never again produce arming evidence -
  # has no analogue here. It can therefore be armed on its own evidence, which a
  # shared flag would have made impossible.
  #
  # TODAY is load-bearing. That is a measurement of the DATA (0 of 1,241 active
  # extract-only instruments hold a ratios row), not a property of the query,
  # which admits any active instrument with an EXTRACTED ANNUAL extract and no
  # filing. So every run reports `fallback:displacedIncumbent=N`; a non-zero N
  # means the premise above has expired and this paragraph has to be re-made
  # rather than re-read.
  #
  # Writes are stamped `DOC_PDF`, which ranks BELOW `NSE_XBRL` in
  # FINANCIALS_AUTHORITY, so a filing-derived row can never be displaced by a
  # reading of a filing - guarded at each write and counted
  # (`fallback:authorityBlocked` in the job-outcome line).
  #
  # Same discipline as the two above: PRESENT and "false" in BOTH specs, so
  # absent and off are never the same state (MONEY-1214); compared against the
  # LITERAL string, never Boolean() - Boolean("false") is true; read PER CALL,
  # never a module-scope const.
  #
  # MONEY-980 / MONEY-1262 - TIINGO_API_KEY is the US price backbone's token,
  # sent as `Authorization: Token <key>`. TIINGO_PLAN sits BESIDE it as a PLAIN
  # env var rather than a secret because it is not one: it names which rate
  # ceilings to obey (COMMERCIAL 20,000/hr / 150,000/day / 100 GB, or
  # REDISTRIBUTION 80,000/hr / 1,200,000/day / 1 TB) and an operator has to be
  # able to read it at a glance. It is set EXPLICITLY in both specs even though
  # `resolveTiingoPlan` already defaults to COMMERCIAL, because "absent" and
  # "explicitly commercial" must not be the same state - that is the
  # MF_METADATA_PROVIDER lesson two paragraphs up, applied before it can happen
  # again. Unset or misspelled resolves to the LOWER pair on purpose: guessing
  # high walks a run into a 429 wall mid-page, guessing low only runs slower.
  #
  #
  # MONEY-980 - CANDLE_EVICT / CANDLE_EVICT_APPLY: the candle store's DELETER.
  # Two switches because they answer two questions. CANDLE_EVICT="off" kills the
  # job in this environment; CANDLE_EVICT_APPLY="true" arms the DELETES, and
  # without it the job selects, verifies against the cold shards and reports
  # exactly what it WOULD remove. Both compare against a LITERAL string, never
  # Boolean(): Boolean("false") is true, which would arm the one configuration
  # meant to keep the deletes off.
  #
  # Both ship PRESENT, ON and DISARMED. Present, because an absent var and a
  # "false" var must not be the same state - "absent" is exactly how
  # MF_METADATA_PROVIDER disabled its job silently for months (MONEY-1214).
  # Disarmed, because this is the only job in the repo that DELETES price
  # history: arming it is a deliberate deploy, with the same shape as
  # XBRL_PROJECTION_APPLY, and its precondition is a dry run whose keptNoShard
  # and keptNotInShard both read 0.
  # MONEY-980 TASK B2 - the four legs of `us-instrument-master-sync`, each with
  # its own switch. Before this there was NO way to stop the US master in an
  # environment short of unsetting TIINGO_API_KEY, which kills every Tiingo path
  # in the repo - EOD prices, corporate actions, news, the search enricher - to
  # disable one leg. EDGAR_CIK_ENRICH and TIINGO_SEARCH_ENRICH already gated
  # their own enrichers in CODE but appeared in NEITHER spec, which is the
  # MF_METADATA_PROVIDER shape (a var that is off-by-absence is a var nobody can
  # see); all four are now PRESENT, so an operator reads the state instead of
  # inferring it.
  #
  #   US_MASTER_SYNC        the 74,125-row reconcile AND the stale sweep
  #   US_NAME_ENRICH        company names from /tiingo/daily/<ticker>
  #   TIINGO_SEARCH_ENRICH  permaTicker from /tiingo/utilities/search
  #   EDGAR_CIK_ENRICH      ticker -> CIK from SEC's company_tickers.json
  #
  # All four are compared against the LITERAL string "off", never Boolean():
  # Boolean("false") is true, which would arm the one configuration meant to
  # keep a job off. "off" is therefore the ONLY disabling value and absent means
  # ON - matching EDGAR_CIK_ENRICH's long-standing semantics rather than
  # inventing a second convention for the same job.
  #
  # PROD ships the two WRITE legs OFF. `us_instruments` is a new collection and
  # the first reconcile CREATES 74,125 rows, so arming it is a deliberate act
  # with the same shape as XBRL_PROJECTION_APPLY. The two read-mostly enrichers
  # ship ON and are harmless no-ops against an empty table.
  #
  # These blocks live ABOVE the step for the reason the next comment gives -
  # they used to sit INSIDE the heredoc, where they cost 900 characters of the
  # 10,000-character arg budget that the two new env entries below now need.
  # This commentary lives ABOVE the step deliberately. Everything inside the
  # heredoc becomes ONE Cloud Build arg with a hard 10,000-character ceiling,
  # where a comment costs exactly as much as configuration. Putting these lines
  # inline is what pushed both files under the safety margin.
  # -----------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        cat > /tmp/service.yaml << EOF
        apiVersion: serving.knative.dev/v1
        kind: Service
        metadata:
          name: ${_SERVICE_NAME}
