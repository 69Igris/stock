                    - name: DODO_PAYMENTS_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: DODO_PAYMENTS_API_KEY_PROD
                          key: latest
                    - name: ANTHROPIC_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: ANTHROPIC_API_KEY_PROD
                          key: latest
                    - name: ZERODHA_API_KEY
                      valueFrom:
                        secretKeyRef:
