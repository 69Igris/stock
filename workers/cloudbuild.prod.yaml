                    - name: RESEND_AUDIENCE_NEWSLETTER_ID
                      valueFrom:
                        secretKeyRef:
                          name: RESEND_AUDIENCE_NEWSLETTER_ID_PROD
                          key: latest
                    - name: DD_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: DD_API_KEY_PROD
                          key: latest
                    - name: CLERK_SECRET_KEY
                      valueFrom:
                        secretKeyRef:
                          name: CLERK_SECRET_KEY_PROD
                          key: latest
                  resources:
                    limits:
                      memory: 4Gi
                      cpu: "2"
                - name: datadog-agent
                  image: gcr.io/datadoghq/serverless-init:latest
                  env:
                    - name: DD_SITE
                      value: us5.datadoghq.com
                    - name: DD_ENV
                      value: production
                    - name: DD_SERVICE
                      value: stockbook-workers
                    - name: DD_APM_ENABLED
                      value: "true"
                    - name: DD_HEALTH_PORT
                      value: "5555"
                    - name: DD_VERSION
                      value: "$COMMIT_SHA"
                    - name: DD_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: DD_API_KEY_PROD
                          key: latest
                  startupProbe:
                    tcpSocket:
                      port: 5555
                    periodSeconds: 10
                    failureThreshold: 5
                  resources:
                    limits:
                      memory: 256Mi
                      cpu: "0.5"
        EOF
        gcloud run services replace /tmp/service.yaml --region=${_REGION}

  # ─────────────────────────────────────────────────────────────────
  # RE-PIN THE CLOUD RUN JOBS (MONEY-1235)
  #
  # Cloud Run JOBS pin their image at PROVISION time. The
  # `gcloud run services replace` above moves the SERVICE and nothing else: a
  # job keeps executing whatever tag it was created with until somebody re-runs
  # a setup script, and nobody re-runs a setup script on a Tuesday.
  #
  # This is neither hypothetical nor rare. All four of feed-parse-prod /
  # fo-summary-prod / feed-backfill-prod / xbrl-backfill-prod drifted to a stale
  # image across ALL FOUR releases of the MONEY-1234/MONEY-1235 cycle and had to
  # be re-pinned BY HAND every time. The first occurrence (2026-08-18) left
  # `feed-parse-prod` four days behind the service: it ran nightly, exited 0,
  # reported SUCCEEDED_COUNT 1, and silently skipped four bond feed families it
  # had never heard of — `bond_master` and `bond_eod` sat at 0 rows
  # (MONEY-1210 / MONEY-1205; MONEY-1189 was the same class one ticket earlier).
  # A drifted job does not fail. It succeeds at running last release's code,
  # which is the failure mode with no symptom.
  #
  # ONLY `--image` IS TOUCHED, and that restriction is load-bearing.
  # `gcloud run jobs update --set-env-vars` REPLACES a job's env list rather
  # than merging into it, and the env/secret block for these jobs is owned by
  # scripts/ops/setup-feed-backfill-job.sh and
  # scripts/ops/setup-xbrl-backfill-job.sh (FEED_ARCHIVE_MODE per env,
  # GCP_STORAGE_BUCKET, DATABASE_URL, GCP_SERVICE_ACCOUNT_KEY_BASE64). Two
  # writers over one job's env is the "whichever ran last wins, silently" bug
  # that split setup-xbrl-backfill-job.sh out of setup-feed-backfill-job.sh in
  # the first place; a re-pin that also rewrote env would reintroduce it on
  # EVERY release, with the loser being a whole environment's archive mode.
  # DD_VERSION is likewise never passed here — it is baked into the image layer
  # by the `--build-arg DD_VERSION=$COMMIT_SHA` above, and making it a property
  # of the JOB SPEC is exactly the forge that would let a stale-pinned job
  # report a fresh SHA.
  #
  # FIRST PROVISIONING STILL BELONGS TO THE SETUP SCRIPTS. `jobs update` fails
  # on a job that does not exist yet, so a miss is WARNED and the release
  # continues — but it is warned loudly and summarised at the end, because a
  # silent skip here would be indistinguishable from the drift this step exists
  # to end.
  #
  # THE LIST IS EVERY JOB ON THIS IMAGE, and the COUNT is deliberately not
  # written here. It read TWELVE against a loop that had grown well past
  # it, and the first attempt to fix that wrote a fresh literal which was
  # stale in the same commit — which is the drift this step exists to end,
  # one layer up. The authority is the loop below and the test that
  # derives from workers/tsup.config.ts; neither needs a number in prose.
  # `workers/tsup.config.ts` declares the entry points that bundle a script (the other two, `index` and `tiingo-realtime`, are the
  # SERVICE and the realtime service, not jobs), and
  # `packages/core/__tests__/ops/job-build-provenance.test.ts` requires every
  # one of them to appear in BOTH re-pin loops or in a reason-carrying
  # exemption map. The exemption map is EMPTY.
  #
  # It read "every job on this image" while being FALSE BY FOUR until
  # MONEY-1317 measured it. `bse-backfill`, `tiingo-us-backfill`,
  # `tiingo-us-corp-actions-backfill` and `tiingo-us-news-seed` were all real,
  # provisioned Cloud Run jobs on this image and in no loop — confirmed against
  # the deployed state on 2026-09-02, which lists `bse-backfill-prod`,
  # `tiingo-us-eod-backfill-prod`, `tiingo-us-corp-actions-backfill-prod` and
  # `tiingo-us-news-seed-prod`. The exclusion existed only as a test comment
  # reading "24h+ one-shots provisioned per campaign", which does not
  # distinguish them from `feed-backfill` and `feed-repair` — also
  # `--task-timeout=86400`, also one-shots, also hand-provisioned, and both in
  # the loop since MONEY-1250. A reason that does not separate the two groups
  # is not a reason.
  #
  # "IT HAS NO SCHEDULE" IS AN ARGUMENT FOR INCLUSION rather than against it.
  # This paragraph used to exempt `feed-repair` as one-shot, hand-provisioned
  # and owned by no setup script; MONEY-1250 put it in the loop and left the
  # exemption standing, and MONEY-1317 found `doc-ingest-backfill` missing on
  # the same reasoning. An on-demand job is the WORST case for drift: it runs
  # rarely enough that nobody correlates the release with the result, and
  # `feed-repair` is a job whose entire purpose is rewriting objects in place.
  #
  # RE-PINNING DOES NOT DISTURB A RUNNING WALK. An execution is created from
  # the job spec at execute time and keeps its own image, so `jobs update`
  # lands on the NEXT execution — which is exactly what a 24h Tiingo or BSE
  # shard wants: finish this shard on the image it started with, start the next
  # one on the current release.
  #
  # `feed-repair` is now genuinely provisionable — MONEY-1317 added its
  # `deploy_job` call to scripts/ops/setup-feed-backfill-job.sh, which
  # build-provenance.ts had been naming in alerts for a job it never created.
  #
  # HOW TO VERIFY — the pin is the CLAIM, the log line is the EVIDENCE. Each of
  # these jobs calls reportBuildProvenance() and prints a `[build-provenance]`
  # line naming the commit it is ACTUALLY running as its first line of output.
  # That SHA must equal this build's $COMMIT_SHA, which is also the service's
  # DD_VERSION:
  #
  #   gcloud run jobs describe feed-parse-prod --region=asia-south1 \
  #     --format='value(spec.template.spec.template.spec.containers[0].image)'
  #   gcloud logging read \
  #     'resource.type=cloud_run_job AND resource.labels.job_name="feed-parse-prod"
  #      AND textPayload:"build-provenance" AND timestamp>="2026-08-21T12:00:00Z"' \
  #     --limit=5 --project=stock-book-483718
  #
  # The explicit `timestamp>=` term is not optional. `--freshness` does NOT
  # bound the query — measured this cycle, a `--freshness=10m` read returned
  # lines 11 hours old — so a wait-loop polling for a provenance line matches a
  # PRE-EXISTING entry instantly and reports the old revision as if it were the
  # new one. See docs/reference/xbrl-switchover-runbook.md.
  # ─────────────────────────────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        set -uo pipefail
        # Character-identical to the tag the build step pushes, the deploy step
        # pins, and the `images:` block lists. Change one, change all four.
        IMAGE="gcr.io/$PROJECT_ID/stockbook-workers:prod-$COMMIT_SHA"
        echo "Re-pinning Cloud Run jobs (${_ENV}) to $${IMAGE}"
        NOT_PINNED=""
        # THE LOOP LIST IS THE GUARD, and it is keyed on the JOB BASE NAME.
        # That is the same string as the tsup entry point for thirteen of the
        # fourteen and is NOT for `tiingo-us-backfill`, which deploys as
        # `tiingo-us-eod-backfill-{env}` (setup-tiingo-backfill-job.sh:366).
        # Keying on the entry point would put `tiingo-us-backfill-{env}` here —
        # a job that does not exist and never will, warning on every build
        # forever while the real one drifts. MONEY-1317.
        #
        # `feed-repair` (MONEY-1250), `doc-ingest-backfill` (MONEY-1314) and
        # the four one-shots after them (MONEY-1317) each shipped OUTSIDE this
        # loop: built into every image, provisioned, on no schedule — so each
        # sat releases behind and nothing ever failed. The two `databento-*`
        # jobs (MONEY-1373) are the same shape — founder-run, on no schedule,
        # and therefore the ones most likely to be reached for months after the
        # image they were pinned to — so they go in from birth rather than
        # being added by the ticket that discovers they are stale. An on-demand
        # job goes stale silently and only bites whoever finally reaches for
        # it, mid-drain.
        for BASE in feed-parse fo-summary feed-backfill feed-repair xbrl-backfill xbrl-projection-drain xbrl-reparse doc-ingest-backfill bse-backfill tiingo-us-eod-backfill tiingo-us-corp-actions-backfill tiingo-us-news-seed databento-harvest databento-append tile-build-d1-in tile-build-d1-us ledger-backfill-databento ledger-backfill-tiingo embeddings-v2-backfill lake-load-databento lake-release event-lake-sink lake-replay-in lake-replay-us filing-registry-sync corp-action-lake-sink identity-sync lake-gold; do
          JOB="$${BASE}-${_ENV}"
          if gcloud run jobs update "$${JOB}" --image="$${IMAGE}" --region=${_REGION} --quiet; then
            echo "  OK       $${JOB} -> $${IMAGE}"
          else
            NOT_PINNED="$${NOT_PINNED} $${JOB}"
            echo "  WARNING  $${JOB} was NOT re-pinned and is still on its previous image."
          fi
        done
        # ONE remediation line PER MISSING JOB, printed once at the end rather
        # than the whole provisioning table on every miss. On QA that is the
        # difference between a few lines and dozens: most of the loop's jobs
        # are not provisioned in QA, and a wall of identical text is a warning
        # nobody reads. The `case` is the same entry-point -> setup-script map
        # as SETUP_SCRIPT_BY_ENTRYPOINT in packages/core/src/ops/build-provenance.ts,
        # which is what a `[build-provenance]` alert from the job itself names —
        # the two must agree, and `*` prints an honest "unmapped" rather than a
        # guessed filename, which is the rule that map exists to enforce.
        if [ -n "$${NOT_PINNED}" ]; then
          echo "WARNING: still on a previous image:$${NOT_PINNED}"
          echo "WARNING: their next run will report a stale SHA in [build-provenance]."
          echo "WARNING: if one is not provisioned yet, create it ONCE with:"
          for JOB in $${NOT_PINNED}; do
            BASE="$${JOB%-${_ENV}}"
            case "$${BASE}" in
              feed-backfill|feed-parse|fo-summary|feed-repair)
                SETUP="setup-feed-backfill-job.sh" ;;
              xbrl-backfill)          SETUP="setup-xbrl-backfill-job.sh" ;;
              xbrl-projection-drain)  SETUP="setup-xbrl-projection-drain-job.sh" ;;
              xbrl-reparse)           SETUP="setup-xbrl-reparse-job.sh" ;;
              doc-ingest-backfill)    SETUP="setup-doc-ingest-backfill-job.sh" ;;
              bse-backfill)           SETUP="setup-bse-backfill-job.sh" ;;
              tiingo-us-*)            SETUP="setup-tiingo-backfill-job.sh" ;;
              databento-*)            SETUP="setup-databento-jobs.sh" ;;
              # MONEY-1499 review — FIVE bases reached `*` and printed
              # "UNMAPPED: add it to SETUP_SCRIPT_BY_ENTRYPOINT" while already
              # being in it. That message is wrong in both directions at the one
              # moment it fires, and it withholds the one thing the operator
              # needs. NOTE `databento-*` does NOT match `ledger-backfill-*`.
              tile-build-d1-*)        SETUP="setup-tile-build-job.sh" ;;
              ledger-backfill-databento) SETUP="setup-databento-jobs.sh" ;;
              ledger-backfill-tiingo) SETUP="setup-tiingo-backfill-job.sh" ;;
              embeddings-v2-backfill) SETUP="setup-embeddings-v2-job.sh" ;;
              # MONEY-1609 — the lake-writer@ jobs. lake-load-databento rides the
              # Databento script (same bucket and inventory), the rest one lake script.
              lake-load-databento)    SETUP="setup-databento-jobs.sh" ;;
              lake-release|event-lake-sink|lake-replay-in|lake-replay-us|filing-registry-sync|corp-action-lake-sink|identity-sync)
                SETUP="setup-lake-jobs.sh" ;;
              lake-gold)              SETUP="setup-dataform.sh" ;;
              *)                      SETUP="" ;;
            esac
            if [ -n "$${SETUP}" ]; then
              echo "  WARNING    $${JOB}  ->  ./scripts/ops/$${SETUP} ${_ENV}"
            else
              echo "  WARNING    $${JOB}  ->  UNMAPPED: add it to SETUP_SCRIPT_BY_ENTRYPOINT and to this case"
            fi
          done
        fi
        # Never fails the release. A job that is not provisioned yet must not
        # block a deploy of the SERVICE, and the pin is proven by the
        # [build-provenance] line rather than by this step's exit code.
        exit 0

  # ─────────────────────────────────────────────────────────────────
  # THE ALWAYS-ON REALTIME SOCKET HOLDER (MONEY-1309)
  #
  # Its OWN Cloud Run service on the SAME image, selected by a `command`
  # override. Not a second entry inside stockbook-workers, and not a second
  # Dockerfile.
  #
  # WHY A SEPARATE SERVICE — the blocking reason is CPU throttling. Cloud Run
  # throttles a container's CPU to near-zero BETWEEN REQUESTS unless
  # `run.googleapis.com/cpu-throttling: "false"` is set, and stockbook-workers
  # is request-driven and does not set it. A websocket living there would be
  # starved between Pub/Sub pushes: missed heartbeats, a watchdog that fires, a
  # reconnect loop that thrashes — and every reconnect buys a full REST snapshot
  # against a METERED api. That service is also maxScale 20, so nineteen
  # instances would run a leader-candidate loop only to lose it.
  #
  # WHY ITS OWN STEP rather than more lines in the heredoc above: that heredoc
  # is ONE Cloud Build arg against a hard 10,000-character ceiling and already
  # measures 11,131 characters. A separate step gets its own budget, and this
  # spec is kept deliberately thin — only the env the socket holder actually
  # reads, not a copy of the worker's ~50 entries.
  #
  # minScale = maxScale = 1, and the leader lock is STILL required: Cloud Run
  # overlaps revisions during a deploy, so the new instance starts before the
  # old one drains and there is a window with two processes and one socket
  # budget. Without the lock that window double-writes bars.
  #
  # `containerConcurrency: 1` because nothing calls it but the health probe.
  # -----------------------------------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: bash
    args:
      - "-c"
      - |
        cat > /tmp/tiingo-realtime.yaml << EOF
        apiVersion: serving.knative.dev/v1
        kind: Service
        metadata:
          name: tiingo-realtime-prod
          annotations:
            run.googleapis.com/ingress: internal
        spec:
          template:
            metadata:
              annotations:
                autoscaling.knative.dev/minScale: "1"
                autoscaling.knative.dev/maxScale: "1"
                run.googleapis.com/cpu-throttling: "false"
                # MONEY-1357 — the socket holder must not start before the agent
                # that receives its traces. The same declaration stockbook-workers
                # carries; without it a cold start drops its first spans against a
                # port nothing is listening on yet.
                run.googleapis.com/container-dependencies: '{"tiingo-realtime":["datadog-agent"]}'
            spec:
              containerConcurrency: 1
              timeoutSeconds: 3600
              serviceAccountName: stockbook-api@$PROJECT_ID.iam.gserviceaccount.com
              containers:
                - name: tiingo-realtime
                  image: gcr.io/$PROJECT_ID/stockbook-workers:prod-$COMMIT_SHA
                  command: ["node", "dist/tiingo-realtime.js"]
                  ports:
                    - containerPort: 8082
                  # WITHOUT THIS, `/health` IS NEVER CALLED. Cloud Run
                  # auto-injects a startupProbe when none is declared and NEVER
                  # injects a livenessProbe — verified across all six services in
                  # this project. The startup probe is a TCP check that passes the
                  # instant `server.listen` binds, and nothing looks again for the
                  # life of the instance. So `UNHEALTHY_AFTER_MS` and the 503 in
                  # main.ts would be dead code: a leader holding a socket that
                  # receives nothing is exactly the failure the probe exists for.
                  # (`HEALTHCHECK` in the Dockerfile is a Docker directive Cloud
                  # Run ignores, and it targets 8080, which this container does
                  # not listen on.)
                  livenessProbe:
                    httpGet:
                      path: /health
                      port: 8082
                    periodSeconds: 30
                    failureThreshold: 3
                  env:
                    - name: NODE_ENV
                      value: prod
                    - name: TIINGO_PLAN
                      value: COMMERCIAL
                    - name: TIINGO_RT_MAX_SYMBOLS
                      value: "3000"
                    # REQUIRED BY THE ARCHIVE. `archiveEnabled()` is
                    # `TIINGO_RT_ARCHIVE !== "off" && Boolean(GCP_STORAGE_BUCKET)`,
                    # so without these the flag reads "on" and every tick is
                    # silently dropped — the exact "a prefix nothing writes to"
                    # state MONEY-1309 set out to end. `uploadFile` also throws
                    # without GCP_PROJECT_ID.
                    - name: GCP_PROJECT_ID
                      value: "stock-book-483718"
                    - name: GCP_STORAGE_BUCKET
                      value: "stockbook-content-prod"
                    - name: TIINGO_RT_ARCHIVE
                      value: "on"
                    - name: TIINGO_RT_BOATS
                      value: "off"
                    - name: TIINGO_BUDGET_CONSUMERS
                      value: "3"
                    # MONEY-1357 — this service was DARK. The image bakes
                    # DD_TRACE_ENABLED=true and DD_SERVICE=stockbook-workers, so
                    # dd-trace booted against an agent that was not here and every
                    # span was dropped, while datadog-metrics no-op'd for want of a
                    # key. It gets its OWN name: a 24x5 socket holder and a
                    # request-driven worker pool are not one service on a service map.
                    - name: DD_TRACE_ENABLED
                      value: "true"
                    - name: DD_SERVICE
                      value: tiingo-realtime
                    - name: DD_ENV
                      value: production
                    - name: DD_VERSION
                      value: "$COMMIT_SHA"
                    - name: DD_TRACE_AGENT_URL
                      value: "http://localhost:8126"
                    - name: DD_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: DD_API_KEY_PROD
                          key: latest
                    - name: TIINGO_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: TIINGO_API_KEY_PROD
                          key: latest
                    - name: DATABASE_URL
                      valueFrom:
                        secretKeyRef:
                          name: DATABASE_URL_PROD
                          key: latest
                    - name: REDIS_URL
                      valueFrom:
                        secretKeyRef:
                          name: REDIS_URL_PROD
                          key: latest
                  resources:
                    limits:
                      memory: 1Gi
                      cpu: "1"
                - name: datadog-agent
                  image: gcr.io/datadoghq/serverless-init:latest
                  env:
                    - name: DD_SITE
                      value: us5.datadoghq.com
                    - name: DD_ENV
                      value: production
                    - name: DD_SERVICE
                      value: tiingo-realtime
                    - name: DD_APM_ENABLED
                      value: "true"
                    - name: DD_HEALTH_PORT
                      value: "5555"
                    - name: DD_VERSION
                      value: "$COMMIT_SHA"
                    - name: DD_API_KEY
                      valueFrom:
                        secretKeyRef:
                          name: DD_API_KEY_PROD
                          key: latest
                  startupProbe:
                    tcpSocket:
                      port: 5555
                    periodSeconds: 10
                    failureThreshold: 5
                  resources:
                    limits:
                      memory: 256Mi
        EOF
        gcloud run services replace /tmp/tiingo-realtime.yaml --region=${_REGION}

images:
  - "gcr.io/$PROJECT_ID/stockbook-workers:prod-$COMMIT_SHA"
  - "gcr.io/$PROJECT_ID/stockbook-workers:prod-latest"
  - "gcr.io/$PROJECT_ID/stockbook-workers:latest"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: "E2_HIGHCPU_8"

timeout: "1200s"
