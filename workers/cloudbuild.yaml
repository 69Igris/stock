# GCP Cloud Build - Workers (Parameterized)
# Usage:
#   QA:   gcloud builds submit --config=workers/cloudbuild.yaml --substitutions=_ENV=qa
#   Prod: gcloud builds submit --config=workers/cloudbuild.yaml --substitutions=_ENV=prod

substitutions:
  _ENV: 'qa'
  _REGION: 'asia-south1'
  _SERVICE_NAME: 'stockbook-workers-${_ENV}'

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stockbook-workers:${_ENV}-$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/stockbook-workers:${_ENV}-latest'
      # MONEY-1205 T5 — MUST stay paired with the `${_ENV}-$COMMIT_SHA` tag
      # above, from the SAME $COMMIT_SHA. workers/Dockerfile does
      # `ARG DD_VERSION=unknown` / `ENV DD_VERSION=${DD_VERSION}`, so this line
      # is what makes a running container able to say which commit it is.
      # It was MISSING here (cloudbuild.prod.yaml and cloudbuild.qa.yaml both
      # had it), which meant any image built through this parameterized config
      # baked the literal string "unknown" — and a Cloud Run JOB pinned to such
      # an image cannot be told apart from a fresh one. Machine-checked by
      # packages/core/__tests__/ops/job-build-provenance.test.ts.
      - '--build-arg'
      - 'DD_VERSION=$COMMIT_SHA'
      - '-f'
      - 'workers/Dockerfile'
      - '.'

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', 'gcr.io/$PROJECT_ID/stockbook-workers']

  # Deploy to Cloud Run (Service, not Job)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - 'gcr.io/$PROJECT_ID/stockbook-workers:${_ENV}-$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '600'
      - '--concurrency'
      - '10'
      - '--service-account'
      - 'stockbook-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-env-vars'
      - 'NODE_ENV=${_ENV}'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL_${_ENV}:latest,REDIS_URL=REDIS_URL_${_ENV}:latest'

images:
  - 'gcr.io/$PROJECT_ID/stockbook-workers:${_ENV}-$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/stockbook-workers:${_ENV}-latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
